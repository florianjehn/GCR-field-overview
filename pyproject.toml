[project]
name = "gcr-field-overview"
version = "0.1.0"
description = "Funding, staff and publications of the global catastrophic risk field, with an interactive site"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.9.0",
    "pre-commit>=3.0",
    "playwright>=1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # E/F: pyflakes/pycodestyle (flake8), I: isort
ignore = ["E203"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
